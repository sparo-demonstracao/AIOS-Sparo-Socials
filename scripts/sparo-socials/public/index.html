<style>
  :root{
    --orange:#FF6633;
    --orange-deep:#E8551F;
    --orange-dark:#C8430F;
    --ink:#2a1206;
    --ink-soft:#7a4427;
    --card:rgba(255,255,255,.86);
    --grad:linear-gradient(135deg,#FF8A4D 0%,#FF6633 55%,#E8551F 100%);
    --shadow:0 6px 20px rgba(120,45,10,.18);
    --shadow-hi:0 14px 34px rgba(120,45,10,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}

  body{
    font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
    color:var(--ink);min-height:100vh;
    display:flex;justify-content:center;
    padding:18px 20px 30px;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(70% 50% at 50% 0%, #FFA76B 0%, transparent 55%),
      linear-gradient(180deg,#FF6633 0%,#E8551F 55%,#B83C0E 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }

  /* canvas 3D ao fundo */
  #scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;min-height:calc(100vh - 48px)}

  /* glow suave atrás do cartão */
  .glow{position:fixed;z-index:0;top:8%;left:50%;width:520px;height:520px;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,210,170,.45),transparent 62%);filter:blur(20px);pointer-events:none}

  .reveal{opacity:0;will-change:transform,opacity}

  /* topo: logo + compartilhar */
  .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
  .chip{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);border:none;cursor:pointer;
    display:grid;place-items:center;box-shadow:var(--shadow);color:var(--orange-deep);
    transition:transform .2s ease,box-shadow .2s ease}
  .chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
  .chip svg{width:19px;height:19px}
  .chip.mark{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(200,67,15,.5)}
  /* botão de compartilhar flutuando no canto superior direito */
  .share-fab{position:fixed;top:14px;right:16px;z-index:6;background:rgba(255,255,255,.95)}

  /* avatar */
  .ava{position:relative;width:104px;height:104px;border-radius:50%;margin-bottom:15px;
    padding:4px;background:linear-gradient(145deg,#fff,#FFD3B0);box-shadow:0 10px 30px rgba(150,55,15,.4)}
  .ava-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;
    background:var(--grad)}
  .ava-img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:cover;border-radius:50%}
  .ava-img.hide{display:none}
  .ava-mono{font-weight:800;font-size:34px;color:#fff;letter-spacing:.5px}

  h1{font-size:24px;font-weight:800;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 14px rgba(120,40,5,.35)}
  .bio{margin-top:6px;color:#fff;opacity:.95;font-size:14px;font-weight:600;text-align:center;max-width:340px;line-height:1.45;text-shadow:0 1px 8px rgba(120,40,5,.25)}

  /* sociais */
  .social{display:flex;gap:24px;margin-top:16px;margin-bottom:4px}
  .social a{color:#fff;transition:transform .2s ease,opacity .2s ease;opacity:.95}
  .social a:hover{transform:translateY(-2px);opacity:1}
  .social svg{width:23px;height:23px;filter:drop-shadow(0 2px 6px rgba(120,40,5,.3))}

  /* botões uniformes (glass) */
  .links{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:15px}
  .btn{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:64px;padding:12px 56px;border-radius:16px;background:var(--card);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
    transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s ease,background .22s ease}
  .btn:hover{transform:translateY(-3px) scale(1.012);box-shadow:var(--shadow-hi);background:rgba(255,255,255,.95)}
  .btn:active{transform:scale(.99)}
  .btn.hero{background:linear-gradient(135deg,#fff 0%,#FFE9DC 100%);border-color:rgba(255,140,90,.6)}
  .label{font-weight:700;font-size:15.5px;text-align:center;letter-spacing:-.01em}
  .thumb{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:46px;height:46px;border-radius:11px;display:grid;place-items:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(200,67,15,.35)}
  .thumb svg{width:24px;height:24px}
  .dots{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:8px;border:none;background:transparent;
    color:#c79a82;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
  .dots:hover{background:rgba(255,102,51,.12);color:var(--orange-deep)}
  .dots svg{width:18px;height:18px}

  /* pílula inferior */
  .join{margin-top:auto;padding-top:34px}
  .join a{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--orange-deep);
    text-decoration:none;font-weight:800;font-size:13.5px;padding:13px 24px;border-radius:999px;
    box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
  .join a:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}

  /* rodapé */
  footer{margin-top:18px;font-size:11px;color:#fff;opacity:.8;font-weight:600;text-align:center}
  footer span{margin:0 6px;opacity:.55}

  /* toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:380px){.btn{padding:12px 52px}.label{font-size:15px}}
  @media (prefers-reduced-motion:reduce){.reveal{opacity:1!important;transform:none!important}}
</style>
</head>

  <!-- Three.js (3D interativo) -->
  <script type="importmap">
  { "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

    const canvas = document.getElementById('scene');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let renderer, scene, camera, group, shapes = [], raf = 0;
    let CLAUDE_SHAPES = null, ANTIGRAV_SHAPES = null, AG_TEX = null;
    const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

    // ---- logos extrudadas em 3D (Claude SVG + Antigravity texturizada) ----
    function makeAntigravity(){
      if (!ANTIGRAV_SHAPES || !AG_TEX) return null;
      const geo = new THREE.ExtrudeGeometry(ANTIGRAV_SHAPES, { depth:3, bevelEnabled:true, bevelThickness:0.35, bevelSize:0.28, bevelSegments:3, curveSegments:64 });
      // UV idêntico à logo: mapeia cada vértice pela posição na viewBox (0..16 / 0..15)
      const p = geo.attributes.position, uv = new Float32Array(p.count*2);
      for (let i=0;i<p.count;i++){ uv[i*2]=p.getX(i)/16; uv[i*2+1]=1-p.getY(i)/15; }
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
      geo.rotateX(Math.PI); geo.scale(0.135,0.135,0.135); geo.center();
      return new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ map:AG_TEX, metalness:0.1, roughness:0.34, clearcoat:1, clearcoatRoughness:0.1, envMapIntensity:0.9, side:THREE.DoubleSide }));
    }
    function makeClaude(){
      if (!CLAUDE_SHAPES) return null;
      const geo = new THREE.ExtrudeGeometry(CLAUDE_SHAPES, { depth:5, bevelEnabled:true, bevelThickness:0.8, bevelSize:0.6, bevelSegments:2, curveSegments:6 });
      geo.rotateX(Math.PI); geo.scale(0.085,0.085,0.085); geo.center();
      return new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color:0xD97757, metalness:0.12, roughness:0.3, clearcoat:1, clearcoatRoughness:0.1, envMapIntensity:0.9, side:THREE.DoubleSide }));
    }

    function init(){
      renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:'high-performance' });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
      camera.position.set(0, 0, 12);

      // ambiente p/ reflexos premium nos materiais
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(5, 8, 6); scene.add(key);
      const warm = new THREE.DirectionalLight(0xffb380, 1.4);
      warm.position.set(-6, -2, 4); scene.add(warm);

      group = new THREE.Group(); scene.add(group);
      // luz de contorno fria p/ destacar as bordas biseladas das logos
      const rim = new THREE.DirectionalLight(0xbcd4ff, 1.6); rim.position.set(-6, 4, -7); group.add(rim);
      const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(4, -3, 6); group.add(fill);

      addEventListener('resize', onResize, { passive:true });
      addEventListener('pointermove', onMove, { passive:true });
      addEventListener('deviceorientation', onTilt, { passive:true });
      document.addEventListener('visibilitychange', ()=> document.hidden ? stop() : start());

      start();

      // carrega os SVGs + a textura colorida do Antigravity e então popula a cena
      const loader = new SVGLoader();
      const load = url => new Promise(res => loader.load(url, d => res(d.paths.flatMap(p => SVGLoader.createShapes(p))), undefined, () => res(null)));
      // textura com as cores REAIS da logo do Antigravity (SVG colorido -> canvas)
      const loadAgTex = () => new Promise(res => {
        const img = new Image();
        img.onload = () => {
          const W=512, H=480, c=document.createElement('canvas'); c.width=W; c.height=H;
          const x=c.getContext('2d'); x.fillStyle='#3B8CFF'; x.fillRect(0,0,W,H); x.drawImage(img,0,0,W,H);
          const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8; res(tex);
        };
        img.onerror = () => res(null);
        img.src='logo-antigravity-full.svg';
      });
      Promise.all([ load('logo-claude.svg'), load('logo-antigravity.svg'), loadAgTex() ]).then(([cs, as, tex]) => {
        CLAUDE_SHAPES = cs; ANTIGRAV_SHAPES = as; AG_TEX = tex;
        if (!CLAUDE_SHAPES && !ANTIGRAV_SHAPES) return;
        buildLogos();
      });
    }

    function buildLogos(){
      const isMob = innerWidth < 640;
      // distribuição em grade com jitter: cobre a tela toda sem ficar alinhado/simétrico
      const aspect = innerWidth / innerHeight;
      const cols = isMob ? 3 : (aspect > 1.7 ? 6 : 5);
      const rows = isMob ? 5 : 4;
      const W = isMob ? 12 : (aspect > 1.7 ? 22 : 19), H = isMob ? 16 : 12;
      const cellW = W / cols, cellH = H / rows;
      // monta as células e embaralha (assim o par Claude/Antigravity não vira xadrez perfeito)
      const cells = [];
      for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) cells.push([c,r]);
      for (let k=cells.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); const t=cells[k];cells[k]=cells[j];cells[j]=t; }

      let i = 0;
      for (const [c,r] of cells){
        // pula ~12% das células e, de vez em quando, deixa uma vazia perto do centro (onde fica o cartão)
        if (Math.random() < 0.12) continue;
        const wantClaude = (i % 2 === 0);
        const mesh = (wantClaude ? (CLAUDE_SHAPES && makeClaude()) : (ANTIGRAV_SHAPES && makeAntigravity()))
                  || (CLAUDE_SHAPES ? makeClaude() : makeAntigravity());
        if (!mesh) continue;
        // centro da célula + jitter parcial (não 100% homogêneo)
        const cx = -W/2 + (c + 0.5) * cellW + (Math.random()-0.5) * cellW * 0.7;
        const cy =  H/2 - (r + 0.5) * cellH + (Math.random()-0.5) * cellH * 0.7;
        mesh.position.set(cx, cy, -1 - Math.random()*6);
        mesh.scale.multiplyScalar(0.55 + Math.random()*0.7);
        mesh.rotation.set((Math.random()-0.5)*0.5, Math.random()*Math.PI*2, (Math.random()-0.5)*0.35);
        mesh.userData.sy = 0.003 + Math.random()*0.006;
        group.add(mesh); shapes.push(mesh);
        i++;

        if (!reduceMotion){
          gsap.to(mesh.position, { y: mesh.position.y + (Math.random()*1.0+0.4),
            duration: 3.4 + Math.random()*3, ease:'sine.inOut', yoyo:true, repeat:-1, delay:Math.random()*2 });
        }
      }
      // intro 3D
      group.scale.setScalar(0.6);
      gsap.to(group.scale, { x:1, y:1, z:1, duration:1.4, ease:'power3.out' });
      gsap.from(camera.position, { z:20, duration:1.6, ease:'power3.out' });
    }

    function onResize(){
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    function onMove(e){
      pointer.tx = (e.clientX/innerWidth - 0.5);
      pointer.ty = (e.clientY/innerHeight - 0.5);
    }
    function onTilt(e){
      if (e.gamma==null) return;
      pointer.tx = Math.max(-0.5, Math.min(0.5, e.gamma/45));
      pointer.ty = Math.max(-0.5, Math.min(0.5, (e.beta-45)/45));
    }

    let t = 0;
    function render(){
      t += 0.005;
      pointer.x += (pointer.tx - pointer.x) * 0.05;
      pointer.y += (pointer.ty - pointer.y) * 0.05;

      // parallax: o conjunto inclina suavemente em direção ao cursor
      group.rotation.y += ( pointer.x * 0.6 - group.rotation.y) * 0.04;
      group.rotation.x += (-pointer.y * 0.4 - group.rotation.x) * 0.04;
      camera.position.x += ( pointer.x * 2 - camera.position.x) * 0.04;
      camera.position.y += (-pointer.y * 1.4 - camera.position.y) * 0.04;
      camera.lookAt(0,0,0);

      for (const m of shapes){
        m.rotation.y += m.userData.sy;
      }
      renderer.render(scene, camera);
      raf = requestAnimationFrame(render);
    }
    function start(){ if(!raf) raf = requestAnimationFrame(render); }
    function stop(){ if(raf){ cancelAnimationFrame(raf); raf = 0; } }

    try { init(); } catch(err){ console.warn('3D indisponível:', err); canvas.style.display='none'; }

    // ---- GSAP: entrada do conteúdo ----
    if (!reduceMotion && window.gsap){
      gsap.set('.reveal', { opacity:0, y:16 });
      gsap.to('.reveal', { opacity:1, y:0, duration:.7, ease:'power3.out', stagger:.08, delay:.15 });
    } else {
      document.querySelectorAll('.reveal').forEach(el=> el.style.opacity=1);
    }
  </script>

  <script>
    const toast=document.getElementById('toast');let tt;
    function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800);}
    document.querySelectorAll('.dots').forEach(d=>d.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      navigator.clipboard?.writeText(d.closest('a').href).then(()=>showToast('Link copiado ✓'));
    }));
    document.getElementById('share').addEventListener('click',async()=>{
      const data={title:'Enzo Barbatto — Automação com IA',url:location.href};
      if(navigator.share){try{await navigator.share(data);}catch(_){}}
      else navigator.clipboard?.writeText(location.href).then(()=>showToast('Link copiado ✓'));
    });
  </script>
</body>
</html>
