<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AIOS · Ícones</title>
<style>
  body{margin:0;background:#070912;color:#e9edf8;font-family:"Segoe UI",system-ui,sans-serif;padding:32px 24px 60px}
  h1{font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
  .sub{color:#8a90a6;margin:0 0 28px;font-size:14px}
  .logo{display:block;max-width:520px;width:100%;border-radius:16px;margin:0 0 40px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .grid{display:flex;gap:28px;flex-wrap:wrap}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px;width:300px}
  .card h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px}
  .tag{font-size:11px;font-weight:700;color:#ff8a4c;border:1px solid rgba(255,138,76,.4);border-radius:20px;padding:2px 9px}
  .big{width:200px;height:200px;border-radius:44px;display:block;margin:0 auto 18px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
  .sizes{display:flex;align-items:center;gap:16px;justify-content:center;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
  .sizes img{border-radius:9px}
  .s64{width:64px;height:64px}.s32{width:32px;height:32px}.s16{width:16px;height:16px}
  .lbl{font-size:11px;color:#8a90a6;text-align:center;margin-top:6px}
  .rec{color:#3ddc97;font-weight:700;font-size:12px}
</style></head><body>
  <h1>AIOS — logo + ícones</h1>
  <p class="sub">O logo escolhido (linha de fluxo) e as 3 opções de ícone derivadas. Veja os tamanhos 64/32/16 px = como aparece na barra de tarefas.</p>
  <img class="logo" src="FINAL-logo.png" alt="logo">
  <div class="grid">
    <div class="card"><h2>Opção 3 <span class="tag">A + linha</span> <span class="rec">★ recomendo</span></h2>
      <img class="big" src="ico-opcao-3.png">
      <div class="sizes"><img class="s64" src="ico-opcao-3.png"><img class="s32" src="ico-opcao-3.png"><img class="s16" src="ico-opcao-3.png"></div>
      <div class="lbl">64 · 32 · 16 px</div></div>
    <div class="card"><h2>Opção 2 <span class="tag">nós neon</span></h2>
      <img class="big" src="ico-opcao-2.png">
      <div class="sizes"><img class="s64" src="ico-opcao-2.png"><img class="s32" src="ico-opcao-2.png"><img class="s16" src="ico-opcao-2.png"></div>
      <div class="lbl">64 · 32 · 16 px</div></div>
    <div class="card"><h2>Opção 1 <span class="tag">clean</span></h2>
      <img class="big" src="ico-opcao-1.png">
      <div class="sizes"><img class="s64" src="ico-opcao-1.png"><img class="s32" src="ico-opcao-1.png"><img class="s16" src="ico-opcao-1.png"></div>
      <div class="lbl">64 · 32 · 16 px</div></div>
  </div>
</body></html>
