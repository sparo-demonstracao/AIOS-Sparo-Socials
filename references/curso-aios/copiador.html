<title>Copiador AIOS MasterClass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --ink: #1d2a30;
    --ink-soft: #5b6b72;
    --line: #e3e1da;
    --accent: #b8860b;
    --accent-ink: #7a5a08;
    --done-bg: #f0f4ef;
    --done-ink: #4a7c59;
    --chip-grad: linear-gradient(90deg, #3b5bdb, #7048e8, #e8590c, #f08c00);
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e161b;
      --surface: #16222a;
      --ink: #e8ecee;
      --ink-soft: #93a4ad;
      --line: #24333c;
      --accent: #e3b341;
      --accent-ink: #e3b341;
      --done-bg: #14231b;
      --done-ink: #7fc296;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e161b;
    --surface: #16222a;
    --ink: #e8ecee;
    --ink-soft: #93a4ad;
    --line: #24333c;
    --accent: #e3b341;
    --accent-ink: #e3b341;
    --done-bg: #14231b;
    --done-ink: #7fc296;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }

  header h1 {
    font-family: 'Montserrat', 'Instrument Sans', sans-serif;
    font-weight: 800; font-size: 26px; margin: 0 0 4px; text-wrap: balance;
  }
  header p { margin: 0; color: var(--ink-soft); }
  .progress { margin-top: 10px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .modulo { margin-top: 36px; }
  .modulo-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .modulo-chip { width: 34px; height: 6px; border-radius: 3px; background: var(--chip-grad); flex: none; }
  .modulo-head h2 {
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: .04em; text-transform: uppercase; margin: 0;
  }

  .aula {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .aula.done { background: var(--done-bg); }
  .aula.done .num { color: var(--done-ink); }

  .row { display: flex; align-items: flex-start; gap: 12px; }
  .row + .row { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .txt { flex: 1; min-width: 0; }
  .num {
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 12px;
    color: var(--accent-ink); letter-spacing: .05em; margin-right: 6px;
  }
  .titulo { font-weight: 600; }
  .desc { color: var(--ink-soft); }
  .chars { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; margin-left: 6px; opacity: .8; }

  button.copy {
    flex: none; font: 600 13px 'Instrument Sans', sans-serif;
    color: var(--accent-ink); background: transparent;
    border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 12px; cursor: pointer; min-width: 92px;
  }
  button.copy:hover { border-color: var(--accent); }
  button.copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.copy.ok { color: var(--done-ink); border-color: var(--done-ink); }

  @media (prefers-reduced-motion: no-preference) {
    button.copy { transition: border-color .15s, color .15s; }
  }
  @media (max-width: 520px) {
    .row { flex-direction: column; gap: 6px; }
    button.copy { align-self: flex-end; }
  }
</style>

<div class="wrap">
  <header>
    <h1>Copiador AIOS MasterClass</h1>
    <p>Títulos e descrições das 15 aulas, prontos pra colar na Kiwify. O cartão fica verde quando você já copiou os dois campos.</p>
    <p class="progress" id="progress"></p>
  </header>
  <div id="app"></div>
</div>

<script>
const DATA = [
  { mod: "Aula 0", aulas: [
    ["0", "Baixe seu kit AIOS", "Baixe o arquivo do seu AIOS pronto e deixe tudo preparado para começar o curso. É o único download de que você precisa."],
  ]},
  { mod: "Módulo 1 — Seu AIOS nasce", aulas: [
    ["1.1", "O que é um AIOS (e o que ele não é)", "A diferença entre usar IA e ter um contratado: os 4 comandos, os 4 Cs e o caminho da nota 25 à nota 100 no primeiro mês."],
    ["1.2", "Instalação sem terminal", "Do ZIP à pasta aberta no Claude Code ou Antigravity, passo a passo na tela — sem terminal e sem uma linha de código."],
    ["1.3", "As 7 perguntas que montam tudo", "Rode o /iniciar junto comigo e veja por que a qualidade das suas 7 respostas define a qualidade de tudo o que vem depois."],
    ["1.4", "Conhecendo seu AIOS por dentro", "Um passeio pelos arquivos que o /iniciar criou e a primeira nota no Boletim — 25, e está certo assim: o jogo começa aqui."],
  ]},
  { mod: "Módulo 2 — Cérebro e mãos", aulas: [
    ["2.1", "Os 4 jeitos do seu AIOS errar", "Quando o AIOS erra, quase sempre é contexto: envenenado, inchado, confuso ou contraditório. Aprenda a reconhecer cada um."],
    ["2.2", "Organizando o cérebro do seu AIOS", "Expertise vs situacional, uma fonte da verdade e os hábitos de higiene que mantêm o contexto vivo — e o AIOS afiado."],
    ["2.3", "Conexões: dando mãos ao seu AIOS", "Mapeie as 5 ferramentas onde seu dia acontece e conecte a primeira ao vivo. Sem conexão o AIOS opina; com conexão ele trabalha."],
    ["2.4", "Segurança: as regras antes de dar a chave", "Só leitura primeiro, rascunho antes de envio e o teste que prova se a conexão vale: as regras que evitam qualquer susto."],
  ]},
  { mod: "Módulo 3 — Colocando pra trabalhar", aulas: [
    ["3.1", "Como escolher o que automatizar", "O Método 3A (Anotar, Avaliar, Automatizar) e o cruzamento dor × meta que aponta a automação certa antes de construir."],
    ["3.2", "Sua primeira automação, do zero ao fim", "Uma automação nascendo inteira ao vivo com o /automatizar — e a regra 60/30/10 que calibra o que é automação de verdade."],
    ["3.3", "Autonomia sem susto", "O Método da Bicicleta: rascunho, revisão, rodar vigiado e só então rodar solto. E o botão de desligar o que não funciona."],
    ["3.4", "Cadência: o AIOS trabalhando enquanto você dorme", "Agende a primeira rotina automática, mantenha o contexto fresco sozinho e monte o loop diário de quem tem um AIOS."],
    ["3.5", "Medindo seu AIOS: nota e painel", "O Boletim vira jogo semanal e a Central de Comando mostra o negócio numa tela: conexões, automações e os 3 próximos passos."],
    ["3.6", "Os 3 erros que matam um AIOS", "Excesso de instrução, setup copiado e código escuro — mais o roteiro de 30 dias para chegar à nota 100 com 5 automações."],
  ]},
];

const app = document.getElementById('app');
const copiado = {}; // "1.1-t" / "1.1-d" -> true
const totalCampos = DATA.reduce((s, m) => s + m.aulas.length * 2, 0);

function copiar(texto, btn, key, card) {
  const grava = () => {
    copiado[key] = true;
    btn.classList.add('ok');
    btn.textContent = 'Copiado ✓';
    setTimeout(() => { btn.textContent = btn.dataset.label; btn.classList.remove('ok'); }, 1600);
    const [num] = key.split('|');
    if (copiado[num + '|t'] && copiado[num + '|d']) card.classList.add('done');
    atualizaProgresso();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(grava).catch(() => fallback(texto, grava));
  } else {
    fallback(texto, grava);
  }
}
function fallback(texto, cb) {
  const ta = document.createElement('textarea');
  ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { alert('Não consegui copiar — selecione o texto manualmente.'); }
  document.body.removeChild(ta);
}
function atualizaProgresso() {
  const n = Object.keys(copiado).length;
  document.getElementById('progress').textContent = n + ' de ' + totalCampos + ' campos copiados';
}

for (const m of DATA) {
  const sec = document.createElement('section');
  sec.className = 'modulo';
  sec.innerHTML = '<div class="modulo-head"><span class="modulo-chip"></span><h2></h2></div>';
  sec.querySelector('h2').textContent = m.mod;
  for (const [num, titulo, desc] of m.aulas) {
    const card = document.createElement('div');
    card.className = 'aula';
    const mk = (label, texto, key, extraHtml) => {
      const row = document.createElement('div');
      row.className = 'row';
      const txt = document.createElement('div');
      txt.className = 'txt';
      txt.innerHTML = extraHtml;
      const btn = document.createElement('button');
      btn.className = 'copy'; btn.type = 'button';
      btn.dataset.label = label; btn.textContent = label;
      btn.addEventListener('click', () => copiar(texto, btn, key, card));
      row.append(txt, btn);
      return row;
    };
    const tSpan = document.createElement('span');
    tSpan.className = 'titulo'; tSpan.textContent = titulo;
    const dSpan = document.createElement('span');
    dSpan.className = 'desc'; dSpan.textContent = desc;

    const rowT = mk('Título', titulo, num + '|t', '');
    rowT.querySelector('.txt').innerHTML = '<span class="num">' + num + '</span>';
    rowT.querySelector('.txt').appendChild(tSpan);

    const rowD = mk('Descrição', desc, num + '|d', '');
    rowD.querySelector('.txt').appendChild(dSpan);
    const chars = document.createElement('span');
    chars.className = 'chars'; chars.textContent = desc.length + '/140';
    rowD.querySelector('.txt').appendChild(chars);

    card.append(rowT, rowD);
    sec.appendChild(card);
  }
  app.appendChild(sec);
}
atualizaProgresso();
</script>
