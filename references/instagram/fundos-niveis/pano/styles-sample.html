<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Amostras de estilo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:'Inter',-apple-system,sans-serif}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;display:grid;place-items:center}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  /* ---------- A: Dark X card ---------- */
  .darkfx{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,20,.62),rgba(8,12,20,.72))}
  .cardDark{position:relative;z-index:2;width:912px;background:#15202b;border:1px solid rgba(255,255,255,.08);
    border-radius:38px;padding:50px 52px 44px;box-shadow:0 40px 90px rgba(0,0,0,.45)}
  .cardDark .name{display:flex;align-items:center;gap:8px;font-weight:800;font-size:33px;color:#fff}
  .cardDark .name svg{width:27px;height:27px}
  .cardDark .handle{font-size:26px;color:#8b98a5;font-weight:500}
  .cardDark .text{margin-top:32px;font-size:43px;line-height:1.34;color:#e7e9ea;font-weight:500}
  .cardDark .text b{font-weight:800;color:#fff}
  .cardDark .lead{font-weight:800;color:#fff}
  .cardDark .sep{height:1px;background:rgba(255,255,255,.1);margin:28px 0 22px}
  .cardDark .stats{display:flex;gap:46px;color:#8b98a5;font-size:25px;font-weight:500}
  .cardDark .time{margin-top:30px;font-size:22px;color:#8b98a5}
  .head{display:flex;align-items:center;gap:18px}
  .ava{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none}
  .x{margin-left:auto;width:40px;height:40px}.x svg{width:100%;height:100%}
  .it{display:inline-flex;align-items:center;gap:12px}.it svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2}

  /* ---------- B: Tipográfico ousado (sem card) ---------- */
  .scrimB{position:absolute;inset:0;background:radial-gradient(64% 50% at 50% 50%,rgba(255,255,255,.92),rgba(255,255,255,.55) 48%,rgba(255,255,255,0) 75%)}
  .typo{position:relative;z-index:2;text-align:center;padding:0 90px;font-family:'Plus Jakarta Sans',sans-serif}
  .pill{display:inline-block;background:linear-gradient(135deg,#FF8A4D,#E8551F);color:#fff;font-weight:800;
    font-size:30px;letter-spacing:.08em;padding:14px 30px;border-radius:999px;margin-bottom:34px;box-shadow:0 12px 28px rgba(200,67,15,.34)}
  .bigname{font-weight:800;font-size:110px;line-height:.98;letter-spacing:-.03em;color:#16202e;margin-bottom:34px}
  .bigdesc{font-weight:600;font-size:42px;line-height:1.36;color:#37485c;max-width:840px;margin:0 auto}
  .bigdesc b{color:#16202e;font-weight:800}

  /* ---------- C: Número gigante ---------- */
  .scrimC{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.82))}
  .num{position:absolute;z-index:1;font-family:'Inter';font-weight:900;font-size:900px;line-height:1;
    color:transparent;-webkit-text-stroke:6px rgba(232,85,31,.22);top:-90px;right:30px}
  .cwrap{position:relative;z-index:2;text-align:left;padding:0 90px;width:100%}
  .clabel{font-weight:800;font-size:30px;letter-spacing:.12em;color:#E8551F;margin-bottom:18px}
  .cname{font-weight:800;font-size:92px;line-height:1;letter-spacing:-.03em;color:#16202e;margin-bottom:30px;font-family:'Plus Jakarta Sans'}
  .cdesc{font-weight:600;font-size:40px;line-height:1.36;color:#37485c;max-width:760px}
  .cdesc b{color:#16202e;font-weight:800}
</style>
</head>
<body>
  <div class="slide" id="slide"></div>
  <script>
    const Q=new URLSearchParams(location.search);
    const STYLE=(Q.get('style')||'A').toUpperCase();
    const N=parseInt(Q.get('n')||'2',10);
    const bg=`pano-s${N}.png`;
    const lead='Nível 1 — O Curioso';
    const descHTML='Você usa a IA como um <b>Google mais esperto</b>. Tira dúvidas, pede resumos.';
    const verified='<svg viewBox="0 0 24 24" fill="#1d9bf0"><path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg>';
    const xlogo='<svg viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>';
    const heart='<span class="it" style="color:#f91880"><svg style="fill:#f91880;stroke:#f91880" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> <b style="color:#f91880">8.947</b></span>';

    const el=document.getElementById('slide');
    let html=`<img class="bg" src="${bg}"/>`;
    if(STYLE==='A'){
      html+=`<div class="darkfx"></div>
      <article class="cardDark">
        <div class="head"><img class="ava" src="foto.jpg"/><div><div class="name">Enzo Barbatto ${verified}</div><div class="handle">@enzosparo</div></div><div class="x">${xlogo}</div></div>
        <div class="text"><span class="lead">${lead}</span><br><br>${descHTML}</div>
        <div class="time"><b style="color:#fff">9:14</b> · 26 de jun de 2026 · <b style="color:#fff">184,2 mil</b> visualizações</div>
        <div class="sep"></div>
        <div class="stats"><span class="it"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> 312</span><span class="it"><svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg> <b style="color:#fff">1,2 mil</b></span>${heart}</div>
      </article>`;
    } else if(STYLE==='B'){
      html+=`<div class="scrimB"></div>
      <div class="typo"><div class="pill">NÍVEL 1</div><div class="bigname">O Curioso</div><div class="bigdesc">${descHTML}</div></div>`;
    } else {
      html+=`<div class="scrimC"></div><div class="num">1</div>
      <div class="cwrap"><div class="clabel">NÍVEL 1</div><div class="cname">O Curioso</div><div class="cdesc">${descHTML}</div></div>`;
    }
    el.innerHTML=html;
    const im=el.querySelector('.bg');
    if(im.complete) window.__ready=true; else { im.onload=()=>window.__ready=true; im.onerror=()=>window.__ready=true; }
  </script>
</body>
</html>
