<!DOCTYPE html>
<!--
  base.html — MOTOR de carrossel do Instagram da Sparo (identidade @enzosparo).
  Não edite o conteúdo aqui. O conteúdo do post vive em slides.js, que define
  window.buildSlides() retornando um array de HTML (use os builders abaixo).
  Assets do post (hero.png etc.) ficam na MESMA pasta. Renderize com render-carousel.mjs.

  Identidade: paleta coral, fonte Archivo (títulos) + Space Grotesk (mono) + Newsreader (itálico),
  faixa/ribbon no canto, paginador @enzosparo N/total, cartões brancos, fundo de grade.
  Tudo 1080×1350 (4:5), capturado em 2× (2160×2700).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Carrossel · Sparo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',sans-serif;background:#3a3a3e}
  .slide{position:absolute;width:1080px;height:1350px;overflow:hidden}
</style>
</head>
<body>
<script src="avatar.js"></script>
<script src="slides.js"></script>
<script>
/* ========================= TEMA (identidade fixa Sparo) ========================= */
const T = { acc:'#DD5731', bg:'#F1E9DC', txt:'#16130F', mut:'#75695A', dark:false };
const ACC=T.acc, BG=T.bg, TXT=T.txt, MUT=T.mut, DARK=T.dark;
const HEAD={font:"'Archivo',sans-serif", wName:900, wClaim:800, tt:'none', ls:'-.02em'};
/* neutros fixos dentro de cartões brancos/mockups (legíveis em qualquer fundo) */
const N_INK='#16130F', N_MUT='#75695A', N_PANEL='#F3EFE8';
const AV = window.AVATAR || '';
const dois = n => String(n).padStart(2,'0');
const hexA=(h,a)=>{h=h.replace('#','');const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
let TOTAL = 7; // sobrescrito por buildSlides via setTotal()
function setTotal(n){TOTAL=n;}
let _pg = 0;                       // paginador automático: numera na ordem de chamada
function nextPage(){return ++_pg;}

/* ========================= PEÇAS COMPARTILHADAS ========================= */
function arrow(w,c){return `<svg width="${w}" height="${w*0.5}" viewBox="0 0 48 24" fill="none"><path d="M2 12h40M34 4l10 8-10 8" stroke="${c||ACC}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function ribbon(){return `<div style="position:absolute;left:84px;top:0;width:74px;height:100px;background:${ACC};clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);box-shadow:0 10px 22px ${hexA(ACC,.3)}"></div>`;}
function pager(n){const bb=DARK?'rgba(243,238,230,.16)':'rgba(22,19,15,.8)';return `<div style="position:absolute;right:84px;top:46px;display:flex;align-items:center;gap:16px;font-family:'Space Grotesk',monospace;font-size:26px;color:${MUT}"><span>@enzosparo</span><span style="background:${bb};color:#fff;border-radius:30px;padding:6px 18px;font-weight:600">${n}/${TOTAL}</span></div>`;}
function bgStyle(){const ln=hexA(TXT,.05);return `background:${BG};background-image:linear-gradient(${ln} 1px,transparent 1px),linear-gradient(90deg,${ln} 1px,transparent 1px);background-size:56px 56px`;}
function specCard(d){
  return `<div style="position:absolute;left:34px;bottom:-26px;width:430px;background:#fff;border-radius:22px;box-shadow:0 26px 50px rgba(22,19,15,.22),0 4px 12px rgba(22,19,15,.1);padding:30px 32px">
    <div style="display:flex;align-items:center;gap:11px;font-family:'Space Grotesk',monospace;font-size:21px;color:${N_MUT}">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="${N_MUT}"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.5 2.5 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.5 2.5 0 0 1 4.5 9h8Z"/></svg>
      enzosparo / <span style="color:${ACC}">${d.tag||''}</span>
    </div>
    <div style="font-family:'Archivo';font-weight:800;font-size:34px;color:${N_INK};margin-top:8px;letter-spacing:-.01em">${d.titulo||''}</div>
    <div style="font-family:'Archivo';font-weight:500;font-size:21px;color:${N_MUT};line-height:1.4;margin-top:6px">${d.sub||''}</div>
  </div>`;
}

/* ========================= MOCKUPS (janela de app, reutilizáveis) ========================= */
const win = (inner,bg)=>`<div style="width:100%;height:100%;border-radius:20px;overflow:hidden;background:${bg||'#fff'};box-shadow:0 30px 60px rgba(22,19,15,.2);border:1px solid rgba(22,19,15,.08)">${inner}</div>`;
const bar = (dark)=>`<div style="display:flex;align-items:center;gap:9px;padding:16px 22px;border-bottom:1px solid ${dark?'rgba(255,255,255,.1)':'rgba(22,19,15,.08)'}"><span style="width:13px;height:13px;border-radius:50%;background:#ff5f57"></span><span style="width:13px;height:13px;border-radius:50%;background:#febc2e"></span><span style="width:13px;height:13px;border-radius:50%;background:#28c840"></span></div>`;
/* mockChat([{de:'user'|'ia', txt:'...'}]) — conversa estilo chat */
function mockChat(msgs){
  const bolhas = msgs.map(m=> m.de==='user'
    ? `<div style="align-self:flex-end;max-width:72%;background:${ACC};color:#fff;font-size:25px;font-weight:600;padding:18px 24px;border-radius:20px 20px 6px 20px">${m.txt}</div>`
    : `<div style="align-self:flex-start;max-width:84%;background:${N_PANEL};color:${N_INK};font-size:24px;font-weight:500;line-height:1.45;padding:20px 24px;border-radius:20px 20px 20px 6px">${m.txt}</div>`
  ).join('');
  return win(`${bar(false)}<div style="padding:30px 34px;display:flex;flex-direction:column;gap:20px;font-family:'Archivo'">${bolhas}</div>`);
}
/* mockTerminal(['linha ok','>linha em progresso']) — prefixe '>' p/ pendente */
function mockTerminal(linhas){
  const ls = linhas.map(t=>{const ok=!t.startsWith('>');const txt=ok?t:t.slice(1);return `<div style="display:flex;gap:14px;align-items:center;font-family:'Space Grotesk';font-size:23px;color:#d7d2c8"><span style="color:${ok?'#46d369':ACC};width:22px">${ok?'✓':'›'}</span>${txt}</div>`;}).join('');
  return win(`${bar(true)}<div style="padding:30px 34px;display:flex;flex-direction:column;gap:18px">${ls}<div style="font-family:'Space Grotesk';font-size:23px;color:#9a8f7e;margin-top:6px">$ <span style="background:#46d369;width:13px;height:24px;display:inline-block;vertical-align:-4px;margin-left:6px"></span></div></div>`,'#16130F');
}
/* mockBrowser(innerHTML) — janela branca com conteúdo livre */
function mockBrowser(inner,dark){return win(`${bar(!!dark)}<div style="padding:30px 34px">${inner}</div>`,dark?'#16130F':'#fff');}
/* mockImage(src) — uma imagem (ex.: hero do Higgsfield) preenchendo a janela */
function mockImage(src){return win(`<img src="${src}" style="width:100%;height:100%;object-fit:cover;object-position:left top"/>`,'#0d0d12');}

/* ========================= BUILDERS DE SLIDE ========================= */
/* capa — eyebrow + título gigante + subtítulo itálico, sobre imagem OU fundo de grade */
function coverSlide(o){
  const heroImg = o.hero ? `<img src="${o.hero}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%"/><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,30,0) 24%,rgba(8,16,30,.45) 52%,rgba(8,16,30,.9) 80%,rgba(8,16,30,.97))"></div>` : '';
  const fundo = o.hero ? 'background:radial-gradient(130% 100% at 50% 12%,#234a78 0%,#0c1d33 64%)' : bgStyle();
  const corTxt = o.hero ? '#fff' : TXT;
  const pagerBg = o.hero ? 'rgba(0,0,0,.5)' : (DARK?'rgba(243,238,230,.16)':'rgba(22,19,15,.8)');
  return `<div style="position:relative;width:100%;height:100%;overflow:hidden;${fundo}">
    ${heroImg}
    <div style="position:absolute;right:84px;top:46px;display:flex;align-items:center;gap:16px;font-family:'Space Grotesk',monospace;font-size:26px;color:${o.hero?'rgba(255,255,255,.7)':MUT}"><span>@enzosparo</span><span style="background:${pagerBg};color:#fff;border-radius:30px;padding:6px 18px;font-weight:600">${nextPage()}/${TOTAL}</span></div>
    <div style="position:absolute;left:84px;bottom:96px;right:84px">
      <div style="display:inline-flex;align-items:center;gap:14px;font-family:'Archivo';font-weight:800;font-size:30px;letter-spacing:.04em;color:${ACC};text-transform:uppercase">${o.eyebrow||''}<span style="width:70px;height:4px;background:${ACC};border-radius:3px"></span></div>
      <div style="font-family:${HEAD.font};font-weight:${HEAD.wName};font-size:${o.titleSize||120}px;line-height:.92;letter-spacing:-.03em;color:${corTxt};margin-top:18px">${o.titulo||''}</div>
      ${o.sub?`<div style="font-family:'Newsreader',serif;font-style:italic;font-size:58px;color:${corTxt};margin-top:18px;opacity:.95">${o.sub}</div>`:''}
    </div>
  </div>`;
}
/* slide de conteúdo — número/eyebrow + claim + um mockup + (opcional) specCard + rodapé */
function bodySlide(o){
  return `<div style="position:relative;width:100%;height:100%;${bgStyle()};padding:96px 84px 84px;display:flex;flex-direction:column">
    ${ribbon()}${pager(nextPage())}
    <div style="margin-top:64px">
      ${o.kicker?`<div style="font-family:'Archivo';font-weight:800;font-size:28px;letter-spacing:.05em;text-transform:uppercase;color:${ACC};margin-bottom:16px">${o.kicker}</div>`:''}
      <div style="font-family:${HEAD.font};font-weight:${HEAD.wName};font-size:64px;line-height:1.04;letter-spacing:${HEAD.ls};color:${TXT}">${o.titulo||''}</div>
      ${o.claim?`<div style="font-family:'Archivo';font-weight:600;font-size:40px;line-height:1.28;color:${MUT};margin-top:18px">${o.claim}</div>`:''}
    </div>
    <div style="position:relative;flex:1;margin:46px 0 0">
      <div style="position:absolute;inset:0 0 ${o.spec?56:0}px 0;">${o.mock||''}</div>
      ${o.spec?specCard(o.spec):''}
    </div>
    ${o.foot?`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-top:24px"><div style="font-family:'Archivo';font-weight:800;font-size:36px;line-height:1.18;color:${TXT};max-width:820px">${o.foot}</div>${arrow(70)}</div>`:''}
  </div>`;
}
/* slide de citação/declaração forte — texto grande centralizado, sem mockup */
function quoteSlide(o){
  return `<div style="position:relative;width:100%;height:100%;${bgStyle()};padding:96px 84px;display:flex;flex-direction:column;justify-content:center">
    ${ribbon()}${pager(nextPage())}
    <div style="font-family:'Newsreader',serif;font-size:84px;line-height:1.18;color:${TXT};font-weight:600">${o.texto||''}</div>
    ${o.fonte?`<div style="margin-top:40px;font-family:'Space Grotesk',monospace;font-size:28px;color:${MUT}">— ${o.fonte}</div>`:''}
  </div>`;
}
/* slide de lista — título + itens (bullets numerados) */
function listSlide(o){
  const itens=(o.itens||[]).map((it,i)=>`<div style="display:flex;gap:24px;align-items:flex-start;margin-top:${i?34:0}px"><span style="font-family:'Space Grotesk';font-weight:700;font-size:40px;color:${ACC};min-width:64px">${dois(i+1)}</span><div><div style="font-family:'Archivo';font-weight:800;font-size:42px;color:${TXT};line-height:1.1">${it.titulo}</div>${it.sub?`<div style="font-family:'Archivo';font-weight:500;font-size:30px;color:${MUT};margin-top:6px;line-height:1.3">${it.sub}</div>`:''}</div></div>`).join('');
  return `<div style="position:relative;width:100%;height:100%;${bgStyle()};padding:96px 84px;display:flex;flex-direction:column">
    ${ribbon()}${pager(nextPage())}
    <div style="margin-top:60px;font-family:${HEAD.font};font-weight:${HEAD.wName};font-size:74px;line-height:1.02;letter-spacing:${HEAD.ls};color:${TXT}">${o.titulo||''}</div>
    <div style="margin-top:54px;flex:1">${itens}</div>
  </div>`;
}
/* CTA final — salve/compartilhe/siga + pílula @enzosparo + frase de bio */
function ctaSlide(o){
  const pill=TXT;
  const line=(t)=>`<div style="display:flex;align-items:center;gap:30px">${arrow(80)}<span style="font-family:'Archivo';font-weight:900;font-size:104px;line-height:1;letter-spacing:-.03em;color:${TXT};text-transform:uppercase">${t}</span></div>`;
  return `<div style="position:relative;width:100%;height:100%;${bgStyle()};padding:96px 84px;display:flex;flex-direction:column;justify-content:center">
    ${ribbon()}${pager(nextPage())}
    <div style="display:flex;flex-direction:column;gap:34px">${line(o.l1||'Salve')}${line(o.l2||'Compartilhe')}${line(o.l3||'Siga')}</div>
    <div style="margin-top:64px;display:inline-flex;align-self:flex-start;align-items:center;gap:20px;background:${pill};border-radius:60px;padding:26px 44px">
      <img src="${AV}" style="width:64px;height:64px;border-radius:50%;object-fit:cover"/>
      <span style="font-family:'Archivo';font-weight:800;font-size:44px;color:#fff">@enzosparo</span>
      ${arrow(66)}
    </div>
    <div style="margin-top:30px;font-family:'Archivo';font-weight:600;font-size:32px;color:${MUT};max-width:840px">${o.bio||'Tá tudo na bio. 🔗'}</div>
  </div>`;
}

/* ========================= LAYOUT + SINAL DE PRONTO ========================= */
const SLIDES = (typeof window.buildSlides === 'function') ? window.buildSlides() : [];
const SW=1080,GX=70,X0=120,Y0=130;
SLIDES.forEach((html,i)=>{
  const f=document.createElement('div');f.className='slide';f.setAttribute('data-screen-label',dois(i+1));
  f.style.left=(X0+i*(SW+GX))+'px';f.style.top=Y0+'px';f.innerHTML=html;document.body.appendChild(f);
});
Promise.all([
  document.fonts.ready,
  ...Array.from(document.images).map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=r;img.onerror=r;}))
]).then(()=>{requestAnimationFrame(()=>requestAnimationFrame(()=>{window.__ready=true;}));});
setTimeout(()=>{window.__ready=true;},9000);
</script>
</body>
</html>
